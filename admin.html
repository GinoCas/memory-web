<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Investigador | NeuroLab</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="admin-body">
  <!-- Encabezado del Panel de Administración -->
  <header class="site-header admin-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">🔬</span>
        <div>
          <h1 class="brand-title">NeuroLab: Panel del Investigador</h1>
        </div>
      </div>
      <div class="header-actions">
        <span class="brand-badge badge-admin">Modo Administrador</span>
        <a href="index.html" class="btn btn-outline btn-sm">← Volver al Experimento</a>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal del Panel de Control -->
  <main id="adminApp" class="app-container" role="main">
    <!-- Renderizado por adminApp.js -->
  </main>

  <!-- ==============================================================================
       SCRIPTS: CAPAS DE ARQUITECTURA LIMPIA COMPATIBLES CON ARCHIVOS LOCALES
       ============================================================================== -->
  <!-- 1. Configuración -->
  <script src="config.js"></script>

  <!-- 2. Capa de Dominio -->
  <script src="js/domain/constants.js"></script>
  <script src="js/domain/Session.js"></script>
  <script src="js/domain/Statistics.js"></script>

  <!-- 3. Capa de Infraestructura -->
  <script src="js/infrastructure/ConfigValidator.js"></script>
  <script src="js/infrastructure/LocalStorageRepo.js"></script>
  <script src="js/infrastructure/LocalStorageSynonymRepo.js"></script>
  <script src="js/infrastructure/LocalStorageDismissedRepo.js"></script>

  <!-- 4. Capa de Casos de Uso -->
  <script src="js/usecases/EvaluateRecall.js"></script>
  <script src="js/usecases/GetStatistics.js"></script>
  <script src="js/usecases/ReevaluateSessions.js"></script>

  <!-- 5. Controlador de Administración -->
  <script src="js/presentation/adminApp.js"></script>

</html>
